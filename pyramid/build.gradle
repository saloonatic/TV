plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 16
        targetSdk 28
        ndk { abiFilters "armeabi-v7a" }
        python {
            buildPython "/usr/bin/python3"
            pip {
                install "lxml"
                install "ujson"
                install "pyquery==1.4.3"
                install "cssselect==1.2.0"
                install "requests"
                install "jsonpath"
                install 'pycryptodome'
                install 'beautifulsoup4'
            }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }
}

dependencies {
    implementation project(':catvod')
}