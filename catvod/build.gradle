plugins {
    id 'com.android.library'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 16
        targetSdk 28
    }
}

dependencies {
    // API18 缺失类垫片：javax.crypto.spec.GCMParameterSpec（API 19 才有）。
    // 大量爬虫用 AES/GCM/NoPadding 解自己的接口数据，4.3 上 new 这个类会抛
    // NoClassDefFoundError，而且多数爬虫在子线程里裸调、没人 catch → 整进程崩。
    // 垫片继承 IvParameterSpec，4.3 的 BC 直接当 IV 用（tag 128 跟在密文后），实测握手/加解密正常。
    // 用预编译 jar 而不是源码：直接放源码会和 compileSdk 的 android.jar 里的同名类打架。
    api files('libs/javax-compat.jar')
    // API18 TLS 兜底栈：系统 JSSE 缺 AES-GCM / SHA256-384 PRF，Conscrypt 自带 BoringSSL
    // 1.4.2 是最后一个 aar minSdk=9 且 native 符号在 4.3 libc 里齐全的版本（2.x 需要 sdallocx，5.0+ 才有）
    api 'org.conscrypt:conscrypt-android:1.4.2'
    api 'androidx.media3:media3-common:' + media3Version
    api 'androidx.annotation:annotation:1.3.0'
    api 'androidx.preference:preference:1.2.1'
    api 'com.google.code.gson:gson:' + gsonVersion
    api 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    api 'com.orhanobut:logger:2.2.0'
    api 'com.squareup.okhttp3:okhttp:' + okhttpVersion
    api 'org.jsoup:jsoup:' + jsoupVersion
    api 'org.nanohttpd:nanohttpd:2.3.1'
    api('com.google.guava:guava:33.2.1-android') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }
}